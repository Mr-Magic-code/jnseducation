version: 2
updates:
  - package-ecosystem: npm
    directory: /jnscrmbackend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      backend-minor:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /jnscrm
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      frontend-minor:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
